<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bikewatching</title>

    
    <link rel="stylesheet" href="global.css" />


    <link rel="stylesheet" href="map.css" />

    
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

   
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

   
    <script src="map.js" type="module"></script>
  </head>

  <body>
    <header style="display: flex; gap: 1em; align-items: baseline;">
      <h1>Boston Bluebikes Traffic</h1>
      
      <!-- Time Slider -->
      <label style="margin-left: auto;">
        Filter by time:
        <input type="range" id="time-slider" min="-1" max="1440" value="-1" />
        <time id="selected-time" style="display: block;"></time>
        <em id="any-time" style="display: block; color: #888; font-style: italic;">(any time)</em>
      </label>
    </header>



    <div id="map">
          <svg></svg>
        </div>

        <div class="legend" style="display: flex !important; flex-direction: row; gap: 2em; margin-block: 1.5em; justify-content: center; width: 100%;">
      
      <div style="display: flex; align-items: center; gap: 0.5em; font-family: sans-serif; font-size: 0.9em; white-space: nowrap;">
        <span style="display: block; width: 15px; height: 15px; border-radius: 50%; background-color: #4682b4;"></span>
        More departures
      </div>

      <div style="display: flex; align-items: center; gap: 0.5em; font-family: sans-serif; font-size: 0.9em; white-space: nowrap;">
        <span style="display: block; width: 15px; height: 15px; border-radius: 50%; background-color: purple;"></span>
        Balanced
      </div>

      <div style="display: flex; align-items: center; gap: 0.5em; font-family: sans-serif; font-size: 0.9em; white-space: nowrap;">
        <span style="display: block; width: 15px; height: 15px; border-radius: 50%; background-color: #ff8c00;"></span>
        More arrivals
      </div>

    </div>

  </body>
</html>
